spring:
  application:
    name: api-gateway

  cloud:
    gateway:
#      mvc:
        routes:
          # User Service Route
          - id: user-service-route
#            uri: lb://user-service
            uri: lb://USER-SERVICE
            predicates:
              - Path=/api/users/**
          #        filters:
          #          - StripPrefix=0

          # Product Service Route
          - id: product-service-route
#            uri: lb://product-service
            uri: lb://PRODUCT-SERVICE
            predicates:
              - Path=/api/products/**
          #        filters:
          #            - StripPrefix=0

          # Order Service Route
          - id: order-service
#            uri: lb://order-service
            uri: lb://ORDER-SERVICE
            predicates:
              - Path=/api/orders/**
        #        filters:
        #            - StripPrefix=0

server:
  port: 8080
#  tomcat:
#    relaxed-query-chars: '_'
#    relaxed-path-chars: '_'

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

